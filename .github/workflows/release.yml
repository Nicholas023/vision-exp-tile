# vision-exp-tile 自动发布工作流（GitHub Actions）
#
# 触发：推送 v* 标签（如 v0.1.1）→ 自动：
#   1) 安装依赖  2) 运行单元测试（npm test）
#   3) 打包 Release 资产 zip  4) 创建 GitHub Release 并附上 zip
#
# 使用：git tag v0.1.1 && git push origin v0.1.1   即可（或网页打 tag）
# 首次使用无需配置：仓库默认启用 Actions；GITHUB_TOKEN 自动提供。
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # 创建 Release 必需

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 运行单元测试
        run: npm test

      - name: 打包 Release 资产（zip）
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          zip -r "dist/vision-exp-tile-v${VER}.zip" \
            src tests scripts package.json README.md LICENSE cordis.patch.yml .gitignore \
            -x '*/node_modules/*'
          echo "已生成 dist/vision-exp-tile-v${VER}.zip"

      - name: 创建 GitHub Release 并附资产
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/vision-exp-tile-v*.zip
